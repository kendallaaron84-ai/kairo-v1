name: Backend persistence

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kairo_test
          POSTGRES_USER: kairo_admin
          POSTGRES_PASSWORD: local-ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairo_admin -d kairo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KAIRO_DATABASE_URL: postgresql+psycopg://kairo_admin:local-ci-admin-password@localhost:5432/kairo_test
      KAIRO_RUNTIME_DATABASE_URL: postgresql+psycopg://kairo_runtime:local-ci-runtime-password@localhost:5432/kairo_test
      KAIRO_RUNTIME_USER: kairo_runtime
      KAIRO_RUNTIME_PASSWORD: local-ci-runtime-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run PostgreSQL migration and test suite
        run: pytest
