services:
  kairo-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - kairo-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  kairo-api:
    build:
      context: ./backend
    environment:
      KAIRO_DATABASE_URL: ${KAIRO_DATABASE_URL:?Set KAIRO_DATABASE_URL in .env}
      KAIRO_RUNTIME_DATABASE_URL: ${KAIRO_RUNTIME_DATABASE_URL:?Set KAIRO_RUNTIME_DATABASE_URL in .env}
      KAIRO_RUNTIME_USER: ${KAIRO_RUNTIME_USER:?Set KAIRO_RUNTIME_USER in .env}
      KAIRO_RUNTIME_PASSWORD: ${KAIRO_RUNTIME_PASSWORD:?Set KAIRO_RUNTIME_PASSWORD in .env}
    depends_on:
      kairo-postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  kairo-postgres-data:
