[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairo-backend"
version = "0.1.0"
description = "Kairo persistent ledger and deterministic risk governor"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "thetadata==1.0.10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires PostgreSQL 16+"]

[tool.ruff]
target-version = "py312"
line-length = 100
